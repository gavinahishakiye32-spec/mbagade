name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Build
        run: npm run build
        env:
          # Build-time config with sane defaults for CI; media stays local on disk.
          MONGODB_URI: mongodb://127.0.0.1:27017/buybuy_ci
          AUTH_SECRET: ci-only-insecure-secret-for-build
          APP_URL: http://localhost:3000
